<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司简介</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column; /* 改为列方向布局 */
            justify-content: flex-start; /* 从顶部开始布局 */
            align-items: center;
            min-height: 100vh; /* 确保内容高度适应屏幕 */
            overflow-y: auto; /* 启用垂直滚动条 */
        }

        .introduction-image {
            width: 100%;
            height: auto; /* 确保宽度适应网页，高度自动调整 */
            margin-bottom: 20px; /* 添加下方间距 */
        }

        .slideshow img {
            position: absolute;
            top: 0; /* 上对齐 */
            left: 50%; /* 水平居中 */
            transform: translateX(-50%); /* 确保图片水平居中 */
            width: 70%; /* 图片宽度为屏幕宽度的70% */
            height: auto; /* 高度自动调整 */
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
    </style>
</head>
<body>
    <h2>公司简介</h2>
    <img src="../assets/images/公司简介.png" alt="公司简介图片" class="introduction-image">
</body>
</html>
