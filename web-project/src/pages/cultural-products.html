    <title>文创产品展示</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin: 20px;
        }

        .gallery-item {
            text-align: center;
        }

        .gallery-item img {
            width: 100%;
            aspect-ratio: 1 / 1; /* 设置宽高比例为1:1 */
            object-fit: cover; /* 确保图片内容适应比例 */
            cursor: pointer;
        }

        .gallery-item p {
            margin-top: 10px;
            font-size: 0.9em;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal img {
            max-width: 90%;
            max-height: 90%;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 1.5em;
            cursor: pointer;
        }
    </style>
</head>

    <script>
        function openModal(src) {
